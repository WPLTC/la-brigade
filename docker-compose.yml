# Base PostgreSQL de développement : docker compose up -d
services:
  db:
    image: postgres:16-alpine
    container_name: la-brigade-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: brigade
      POSTGRES_PASSWORD: brigade
      POSTGRES_DB: la_brigade
    ports:
      - "5434:5432"
    volumes:
      - la-brigade-data:/var/lib/postgresql/data
      - ./server/prisma/init-test-db.sql:/docker-entrypoint-initdb.d/init-test-db.sql:ro

volumes:
  la-brigade-data:
